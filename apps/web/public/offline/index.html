<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>OpenFlipbook Offline</title>
  <link rel="stylesheet" href="assets/player.css">
</head>
<body>
  <main id="app" class="book-shell">
    <header class="toolbar">
      <button id="back" type="button" aria-label="上一頁">←</button>
      <button id="forward" type="button" aria-label="下一頁">→</button>
      <select id="page-select" aria-label="所有頁面"></select>
      <span id="status" role="status" aria-live="polite"></span>
    </header>
    <section id="page-surface" class="page-surface" aria-live="polite">
      <div id="image-stage" class="image-stage">
        <img id="page-image" alt="">
        <div id="text-layer" class="text-layer"></div>
      </div>
    </section>
    <footer class="offline-note">離線複習版 · 未探索的知識點需要回到線上版本繼續生成</footer>
  </main>
  <script src="data/book.js"></script>
  <script src="assets/player.js"></script>
</body>
</html>
